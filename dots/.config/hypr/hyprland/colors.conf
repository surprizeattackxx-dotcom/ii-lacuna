general {
    col.active_border = rgba(88717b77)
    col.inactive_border = rgba(dbbfcb55)
}

misc {
    background_color = rgba(1b1016FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(fff8f8FF)
        col.text = rgba(23181eFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(23181e), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(23181e), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(23181e), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(840060AA) rgba(84006077), match:pin 1

# Repointed 2026-08-24: fuzzel_theme.ini was matugen output, frozen at
# 2026-06-27 since matugen hasn't run since the noctalia v5 migration.
# themes/noctalia is Noctalia's own live Template Processor output, and this
# top-level include already applies in dmenu mode too — fuzzel.ini(5) only
# allows `mode`/`exit-immediately-if-empty` in [dmenu], so the old per-section
# `include=` below was never valid and `fuzzel --check` has been failing on
# it since the file was written. Removed rather than repointed.
include=/home/donnie/.config/fuzzel/themes/noctalia
font=Google Sans Flex:weight=medium
terminal=kitty -1
prompt=">>  "
layer=overlay

[border]
radius=17
width=1

[dmenu]
exit-immediately-if-empty=yes

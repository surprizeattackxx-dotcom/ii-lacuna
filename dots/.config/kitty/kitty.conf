background_opacity 1
# The old matugen->quickshell theme include (kitty-theme.conf) was dropped
# 2026-08-24: matugen hasn't run since the noctalia v5 migration, so that file
# was frozen at 2026-06-27 and was leaking 20 stale color232-255 extended-
# palette entries that themes/noctalia.conf (loaded below) doesn't define.
# Live theming now comes entirely from `include themes/noctalia.conf`.

allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Font
font_family      FantasqueSansM Nerd Font
bold_font        FantasqueSansM Nerd Font
italic_font      FantasqueSansM Nerd Font
bold_italic_font FantasqueSansM Nerd Font
font_size 12.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Claude Code
map ctrl+shift+k launch --cwd=current claude

# Typing particles: REMOVED 2026-08-15. The shell half never ran under the
# native noctalia v5 binary (it doesn't load ~/.config/quickshell at all), so
# every kitty window was running a ~50Hz poll timer writing into a socket
# nobody served. It failed silently, which is why it went unnoticed.
# The QML half (Services/Particles, Modules/Particles) is still in this repo
# and in git history if it's ever ported to a native v5 plugin.

include themes/noctalia.conf














